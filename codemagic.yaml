workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Show build environment
        script: |
          java -version
          gradle --version
      - name: Build release APK
        script: |
          gradle --no-daemon --stacktrace assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/debug/*.apk
